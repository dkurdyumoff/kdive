name: Deploy Script Bot → Fly.io

on:
  push:
    branches: [main]
    paths:
      - kdive/outreach/script_bot.py
      - kdive/outreach/Dockerfile
      - kdive/outreach/requirements.txt
      - kdive/outreach/fly.toml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: kdive/outreach
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
